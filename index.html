<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spam Shield Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --secondary: #2196F3;
            --danger: #F44336;
            --success: #4CAF50;
            --dark-bg: #0A0E17;
            --card-bg: #1A1F2E;
            --card-border: #2A3142;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B7C3;
            --spam-gradient: linear-gradient(135deg, #FF416C, #FF4B2B);
            --ham-gradient: linear-gradient(135deg, #4CAF50, #2E7D32);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(41, 196, 255, 0.03) 0%, transparent 55%),
                radial-gradient(circle at 85% 30%, rgba(133, 89, 255, 0.03) 0%, transparent 55%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .logo-text {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--primary);
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .char-count {
            font-weight: 500;
        }

        .message-input {
            width: 100%;
            height: 140px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .analyze-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            margin-top: 10px;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .analyze-btn:active {
            transform: translateY(1px);
        }

        .analyze-btn i {
            font-size: 20px;
        }

        .result-container {
            margin-top: 25px;
            overflow: hidden;
            height: 0;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-container.show {
            height: 120px;
            opacity: 1;
        }

        .result-box {
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-box.spam {
            background: var(--spam-gradient);
            color: white;
        }

        .result-box.ham {
            background: var(--ham-gradient);
            color: white;
        }

        .result-icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .result-text {
            font-size: 18px;
            font-weight: 600;
        }

        .result-subtext {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 400;
        }

        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: var(--text-secondary);
            font-size: 13px;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .card {
                padding: 20px;
            }
            
            .logo-text {
                font-size: 28px;
            }
            
            .message-input {
                height: 120px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <div class="logo-text">SpamShield</div>
        </div>
        <div class="tagline">AI-powered spam detection for safer communication</div>
    </div>

    <div class="card">
        <div class="card-title">
            <i class="fas fa-search"></i>
            Message Analysis
        </div>
        
        <div class="input-group">
            <div class="input-label">
                <span>Enter your message</span>
                <span class="char-count"><span id="charCount">0</span> characters</span>
            </div>
            <textarea 
                id="msg" 
                class="message-input" 
                placeholder="Paste or type the message you want to analyze..."
            ></textarea>
        </div>
        
        <button class="analyze-btn" onclick="checkSpam()">
            <i class="fas fa-magnifying-glass"></i>
            Analyze for Spam
        </button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Analyzing your message...</div>
        </div>
        
        <div class="result-container" id="resultContainer">
            <div id="resultBox" class="result-box"></div>
        </div>
    </div>
    
    <div class="footer">
        Powered by AI • Real-time spam detection
    </div>
</div>

<script>
    // Character counter for textarea
    const textarea = document.getElementById('msg');
    const charCount = document.getElementById('charCount');
    
    textarea.addEventListener('input', function() {
        charCount.textContent = this.value.length;
    });
    
    async function checkSpam() {
        let msg = document.getElementById("msg").value.trim();
        
        if (!msg) {
            alert("Please enter a message to analyze.");
            return;
        }
        
        // Show loading animation
        document.getElementById("loading").style.display = "flex";
        document.getElementById("resultContainer").classList.remove("show");
        
        try {
            // Original API call - unchanged functionality
            let res = await fetch("http://127.0.0.1:5000/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg })
            });

            let data = await res.json();

            // Hide loading animation
            document.getElementById("loading").style.display = "none";
            
            let box = document.getElementById("resultBox");
            let container = document.getElementById("resultContainer");
            
            if (data.prediction === "Spam") {
                box.className = "result-box spam";
                box.innerHTML = `
                    <div class="result-icon">🚨</div>
                    <div class="result-text">Spam Detected!</div>
                    <div class="result-subtext">This message appears to be spam</div>
                `;
            } else {
                box.className = "result-box ham";
                box.innerHTML = `
                    <div class="result-icon">✅</div>
                    <div class="result-text">Safe Message</div>
                    <div class="result-subtext">This message appears to be legitimate (Ham)</div>
                `;
            }
            
            // Show result with animation
            setTimeout(() => {
                container.classList.add("show");
            }, 50);
            
        } catch (error) {
            // Hide loading animation
            document.getElementById("loading").style.display = "none";
            
            // Show error in result box
            let box = document.getElementById("resultBox");
            let container = document.getElementById("resultContainer");
            
            box.className = "result-box";
            box.style.background = "linear-gradient(135deg, #FF9800, #F57C00)";
            box.innerHTML = `
                <div class="result-icon">⚠️</div>
                <div class="result-text">Connection Error</div>
                <div class="result-subtext">Please check your connection and try again</div>
            `;
            
            // Show result with animation
            setTimeout(() => {
                container.classList.add("show");
            }, 50);
            
            console.error("Error:", error);
        }
    }
    
    // Initialize character count
    charCount.textContent = textarea.value.length;
    
    // Add Enter key support (Shift+Enter for new line, Enter to submit)
    textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            checkSpam();
        }
    });
</script>

</body>
</html>
